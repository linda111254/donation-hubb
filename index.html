<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda Dirk — Connected Portals Hub</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f1f5f9; 
            color: #1e293b; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .hub-container { 
            background: #ffffff; 
            max-width: 500px; 
            width: 100%; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.04); 
            border: 1px solid #e2e8f0; 
            text-align: center;
        }
        .profile-avatar {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin: 0 auto 15px auto;
        }
        h1 { margin: 0; font-size: 22px; color: #0f172a; font-weight: 700; }
        .tagline { margin: 6px 0 25px 0; color: #64748b; font-size: 14px; font-weight: 500; }
        
        .links-stack { display: flex; flex-direction: column; gap: 14px; }
        
        /* Premium Action Button Styles */
        .hub-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hub-btn:hover {
            transform: translateY(-2px);
        }
        
        /* Campaign Button Colors */
        .btn-campaign {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16,185,129,0.25);
        }
        /* Safari Corporate Colors */
        .btn-safari {
            background-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2,132,199,0.25);
        }
    </style>
</head>
<body>

<div class="hub-container">
    <div class="profile-avatar">LD</div>
    <h1>Linda Dirk</h1>
    <p class="tagline">System Infrastructure & Social Impact Management</p>

    <div class="links-stack">
        <!-- 🟢 PORTAL 1: YOUR LIVE VERIFIED GIVETH CRYPTO PORTAL -->
        <a href="https://giveth.io" target="_blank" class="hub-btn btn-campaign">
            🤝 Support "Building a Better Tomorrow" Campaign
        </a>

        <!-- 🦁 PORTAL 2: YOUR CORPORATE SAFARI WEB PORTAL -->
        <a href="https://github.io" target="_blank" class="hub-btn btn-safari">
            🦁 Explore Maajabu Safaris Portal
        </a>
    </div>
</div>

</body>
</html>
